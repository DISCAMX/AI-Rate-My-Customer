<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RateMyCustomer Complete Flow Wireframes</title><style>
:root{--navy:#0b2545;--blue:#1f6feb;--teal:#00a88f;--gold:#f2b134;--ink:#172b3e;--muted:#64748b;--line:#dbe4ec;--bg:#edf2f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}.top{height:72px;background:var(--navy);color:white;display:flex;align-items:center;gap:15px;padding:0 24px;position:sticky;top:0;z-index:5}.mark{width:45px;height:45px;display:grid;place-items:center;background:linear-gradient(135deg,#123b69,#087b72);clip-path:polygon(50% 0,95% 17%,88% 72%,50% 100%,12% 72%,5% 17%);font-size:10px;font-weight:900;color:var(--gold)}.top strong{font-size:17px}.top small{display:block;color:#abc0d3}.progress{margin-left:auto;color:#c7d7e5;font-weight:800}.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 72px)}aside{background:white;border-right:1px solid var(--line);padding:20px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.group{font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:900;margin:18px 8px 7px}.nav{width:100%;border:0;background:none;border-radius:8px;padding:10px;text-align:left;color:#42566a;font-weight:750;cursor:pointer}.nav.active{background:#e8f1ff;color:var(--blue)}main{padding:30px;max-width:1200px;width:100%;margin:auto}.intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.eyebrow{font-size:10px;color:var(--blue);letter-spacing:.13em;font-weight:900;margin:0 0 7px}h1{font-size:31px;margin:0}h2{margin:0 0 7px}.intro p,.copy{color:var(--muted)}.stage{display:grid;grid-template-columns:minmax(290px,430px) 1fr;gap:24px;align-items:start}.device{background:#111c28;border:7px solid #516172;border-radius:30px;padding:11px;box-shadow:0 25px 60px #15304c30;min-height:690px}.screen{background:#f8fbfd;border-radius:18px;min-height:654px;overflow:hidden}.screen-head{padding:20px;background:var(--navy);color:white;display:flex;justify-content:space-between}.content{padding:22px}.badge{display:inline-block;border-radius:99px;background:#dff5ef;color:#08735f;padding:5px 9px;font-size:10px;font-weight:900}.card{background:white;border:1px solid var(--line);border-radius:11px;padding:15px;margin:11px 0;box-shadow:0 5px 18px #17324d08}.card h3{margin:0 0 5px}.field{border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--muted);margin:8px 0;background:white}.button{display:block;width:100%;border:0;background:var(--blue);color:white;border-radius:8px;padding:12px;font-weight:900;margin-top:10px}.button.alt{background:white;color:var(--navy);border:1px solid var(--line)}.choice{display:flex;align-items:center;gap:10px}.choice i{width:36px;height:36px;border-radius:9px;background:#e8f1ff;display:grid;place-items:center;color:var(--blue);font-style:normal;font-weight:900}.metric{font-size:28px;font-weight:900;color:var(--navy)}.bar{height:7px;border-radius:99px;background:#dce6ee;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue))}.explain{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.explain ol{padding-left:20px}.explain li{margin:10px 0}.rule{border-left:4px solid var(--gold);background:#fff8df;padding:13px;margin-top:15px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{padding:5px 8px;border-radius:99px;background:#edf2f6;color:#52697d;font-size:10px;font-weight:800}.screen-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e7edf2}.screen-row b{color:var(--teal)}@media(max-width:820px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow:auto;padding:10px}.group{display:none}.nav{min-width:max-content}.stage{grid-template-columns:1fr}.device{max-width:430px;margin:auto}main{padding:20px}.progress{display:none}}
</style></head><body><header class="top"><span class="mark">RMC</span><div><strong>RateMyCustomer</strong><small>Your reputation works both ways.</small></div><span class="progress" id="progress">01 / 14</span></header><div class="layout"><aside id="nav"></aside><main><section class="intro"><div><p class="eyebrow" id="phase">ONBOARDING</p><h1 id="title">Choose how you use RMC</h1><p id="summary">Start as a customer or a service provider. Roles can be added later.</p></div></section><section class="stage"><div class="device"><div class="screen"><div class="screen-head"><span>9:41</span><strong>RMC</strong><span>•••</span></div><div class="content" id="screen"></div></div></div><article class="explain"><p class="eyebrow">UX REQUIREMENTS</p><h2 id="why">Clear role selection</h2><p class="copy" id="details"></p><ol id="requirements"></ol><div class="rule" id="rule"></div></article></section></main></div><script>
const flows=[
['Onboarding','Choose how you use RMC','Start as a customer or a service provider. Roles can be added later.','Clear role selection','Avoids mixing business permissions with personal reputation controls.',['Customer, passenger or guest','Restaurant, retailer, contractor or gig servicer','Explain permissions before requesting them'],'No account receives reporting authority by default.',`<span class="badge">WELCOME</span><h2>How will you use RMC?</h2><div class="card choice"><i>C</i><div><h3>Customer</h3><span class="copy">Build standing and unlock benefits</span></div></div><div class="card choice"><i>S</i><div><h3>Service provider</h3><span class="copy">Verify interactions and reward reliability</span></div></div><button class="button">Continue</button>`],
['Identity','Verify your identity','Build a trusted record without exposing sensitive information.','Progressive verification','Ask only for the assurance level required by the action.',['Email or mobile confirmation','Government ID only when risk requires it','Separate identity confidence from reputation'],'Identity verification does not prove a complaint or review is true.',`<span class="badge">STEP 2 OF 4</span><h2>Verify your account</h2><div class="field">Legal name</div><div class="field">Mobile number</div><div class="field">Email address</div><div class="card"><strong>Privacy promise</strong><p class="copy">Your contact details are never displayed with reviews.</p></div><button class="button">Verify securely</button>`],
['Permissions','Choose notifications','Control exactly which alerts and contact sources RMC can use.','Permission before access','Every permission has a purpose, frequency and revocation path.',['Notifications requested after explanation','Selected contacts instead of entire address book','Marketing separated from case notices'],'Essential dispute notices remain available without marketing consent.',`<h2>Stay informed</h2><div class="card screen-row"><span>Review matches</span><b>On</b></div><div class="card screen-row"><span>Complaint responses</span><b>On</b></div><div class="card screen-row"><span>Benefit unlocks</span><b>On</b></div><div class="card screen-row"><span>Marketing</span><span>Off</span></div><button class="button">Save preferences</button><button class="button alt">Not now</button>`],
['Import','Import verified customers','A provider selects legitimate business contacts and reviews every transferred field.','Authorized contact matching','Supports transaction verification without creating profiles from an address book.',['CSV, CRM, POS or selected contacts','Reject sensitive and unrelated fields','Provider certification before transfer'],'An uploaded contact cannot create a rating or prove authorship.',`<span class="badge">SERVICER</span><h2>Add customer records</h2><div class="card choice"><i>CSV</i><div><h3>Upload a file</h3><span class="copy">Map fields before import</span></div></div><div class="card choice"><i>CRM</i><div><h3>Connect business system</h3><span class="copy">One-time or scheduled sync</span></div></div><div class="card choice"><i>+</i><div><h3>Select contacts</h3><span class="copy">Business contacts only</span></div></div>`],
['Dashboard','Understand your standing','The customer sees benefits, rating factors, disputes and rewards in one place.','Explainable standing','A score must never appear without source categories and correction access.',['Principal positive and negative factors','Pending matters excluded from scoring','Direct route to report and dispute'],'Standing changes require verified information and an explanation.',`<span class="badge">PREFERRED</span><h2>Your RMC Standing</h2><div class="metric">782</div><p class="copy">Strong verified reliability</p><div class="bar"><span style="width:78%"></span></div><div class="card"><h3>12 benefits unlocked</h3><p class="copy">Priority reservations · preferred pricing · upgrades</p></div><button class="button">View my RMC Report</button>`],
['RMC Report','Review verified history','Every report separates verified facts, provider opinion, disputes and resolutions.','Structured report','Makes the record understandable and contestable.',['Verified interaction timeline','Principal standing factors','Who accessed the report and why'],'Disputed information stays visibly labeled and may be excluded from scoring.',`<h2>RMC Report</h2><div class="card"><small>VERIFIED HISTORY</small><div class="screen-row"><span>Completed as agreed</span><b>18</b></div><div class="screen-row"><span>Successful resolutions</span><b>3</b></div><div class="screen-row"><span>Open disputes</span><span>1</span></div></div><div class="card"><h3>Principal factors</h3><div class="tags"><span>Payment</span><span>Communication</span><span>Resolution</span></div></div><button class="button alt">Dispute information</button>`],
['Servicer QR','Request an honest Google review','A signed interaction link routes the customer to the provider’s selected public review destination.','Transparent review request','The invitation asks for honest feedback and records no reward based on sentiment.',['Signed transaction-specific URL','Expiration and replay protection','Disclosure of any participation incentive'],'Never ask only customers expected to leave positive reviews.',`<span class="badge">VERIFIED VISIT</span><h2>Share an honest experience</h2><div class="card" style="text-align:center;padding:35px"><div class="metric">▦</div><strong>RMC-S-4821</strong></div><p class="copy">Scan to review this interaction on Google. Positive or negative feedback is welcome.</p><button class="button">Share invitation</button>`],
['Customer QR','Request a customer review','A customer, passenger or guest shares a signed QR after a verified interaction.','Reciprocal accountability','The servicer reviews the interaction; participation points do not depend on rating.',['Transaction match before posting','Customer notified of the completed review','Points for verified participation only'],'No points, benefit or token reward may depend on a positive rating.',`<span class="badge">CUSTOMER QR</span><h2>Help build my standing</h2><div class="card" style="text-align:center;padding:35px"><div class="metric">▦</div><strong>RMC-C-7394</strong></div><div class="card"><h3>+25 participation points</h3><p class="copy">Same points for any honest verified rating.</p></div><button class="button">Share my QR</button>`],
['Complaint','Submit a factual complaint','The servicer starts with a verified transaction and specific evidence.','Evidence before impact','A submission enters verification rather than immediately changing standing.',['Structured allegation categories','Original evidence and provenance','False-submission enforcement'],'Submitted and disputed complaints have no rating effect.',`<span class="badge">NO RATING EFFECT</span><h2>Start with the transaction</h2><div class="field">Customer or transaction ID</div><div class="field">Complaint category</div><div class="field" style="height:90px">Factual summary</div><button class="button">Save verification draft</button>`],
['Evidence','Verify the record','Automated screening and human review compare original evidence and chronology.','Authenticity workflow','Detects alteration and mismatches without pretending AI makes the final decision.',['File hash and capture metadata','Duplicate and manipulation screening','Human decision for material consequences'],'AI flags risk; authorized reviewers determine reportable status.',`<h2>Evidence review</h2><div class="card screen-row"><span>Original invoice</span><b>Verified</b></div><div class="card screen-row"><span>Service timestamp</span><b>Verified</b></div><div class="card screen-row"><span>Customer messages</span><span>Screening</span></div><div class="card screen-row"><span>Identity match</span><b>Verified</b></div><button class="button">Request customer response</button>`],
['Response','Give the customer a voice','The customer can confirm, deny, correct or counter the provider’s evidence.','Meaningful response','Free access to the material claim and sufficient response time.',['This is not me control','Counter-evidence upload','Resolution and mediation options'],'Silence is not treated as admission.',`<span class="badge">6 DAYS LEFT</span><h2>A provider submitted a claim</h2><div class="card"><h3>Disputed chargeback</h3><p class="copy">Transaction RMC-2048 · $186.40</p></div><button class="button">Respond with facts</button><button class="button alt">This is not me</button><button class="button alt">Request FairResolve</button>`],
['Appeal','Dispute or appeal a decision','A corrected record is rescored and downstream users receive the appropriate update.','Independent reconsideration','Separates the original decision from appeal review.',['Reason and evidence for decision','Appeal status and deadline','Correction and redisclosure workflow'],'Unresolved disputes remain attached to future reports when required.',`<h2>Appeal decision</h2><div class="card"><small>CASE RMC-2048</small><h3>Partially verified</h3><p class="copy">One evidence item did not meet authenticity requirements.</p></div><div class="field">Explain the disputed finding</div><div class="field">Add supporting evidence</div><button class="button">Submit appeal</button>`],
['Benefits','Unlock and redeem benefits','Providers configure recognition tiers while customers see eligibility and redemption terms.','Positive opportunity','Benefits sit above a clear standard offer and cannot punish protected activity.',['Tier, location and expiration','Cost and availability controls','Redemption receipt and reversal'],'Never require review removal, legal waiver or private data.',`<span class="badge">PREMIER</span><h2>Benefits near you</h2><div class="card"><h3>Priority reservation</h3><p class="copy">Harbor House · available tonight</p><button class="button">Reserve with benefit</button></div><div class="card"><h3>15% service discount</h3><p class="copy">Verified participating locations</p><button class="button alt">Show redemption code</button></div>`],
['Rewards','Control data and rewards','Metadata licenses are selected individually with clear permitted use and estimated test rewards.','Consent-controlled exchange','Private records remain off-chain; consent and provenance receipts are verifiable.',['Per-tag consent and license duration','DISC, VISC or AMDX selection','Revocation for future use and full history'],'All rewards remain test-mode until contracts and custody are approved.',`<span class="badge">AI DATA EXCHANGE</span><h2>Choose metadata licenses</h2><div class="card screen-row"><span>Service category</span><b>+2.5</b></div><div class="card screen-row"><span>Resolution outcome</span><b>+5.0</b></div><div class="card screen-row"><span>AI training license</span><span>Off</span></div><div class="tags"><span>DISC</span><span>VISC</span><span>AMDX</span></div><button class="button">Review consent receipt</button>`]
];
const groups=[['START',0,4],['REPUTATION',4,8],['FAIR PROCESS',8,12],['OPPORTUNITY',12,14]];const nav=document.querySelector('#nav');groups.forEach(([g,a,b])=>{nav.insertAdjacentHTML('beforeend',`<div class="group">${g}</div>`);flows.slice(a,b).forEach((f,i)=>nav.insertAdjacentHTML('beforeend',`<button class="nav" data-i="${a+i}">${String(a+i+1).padStart(2,'0')} · ${f[0]}</button>`))});
function show(i){const f=flows[i];document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',+n.dataset.i===i));phase.textContent=f[0].toUpperCase();title.textContent=f[1];summary.textContent=f[2];why.textContent=f[3];details.textContent=f[4];requirements.innerHTML=f[5].map(x=>`<li>${x}</li>`).join('');rule.textContent=f[6];screen.innerHTML=f[7];progress.textContent=`${String(i+1).padStart(2,'0')} / ${flows.length}`;window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>show(+n.dataset.i));show(0);
</script></body></html>
