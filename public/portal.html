<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RateMyCustomer — Customer & Servicer Portal</title><style>
:root{--ink:#061521;--panel:#0c2d3e;--teal:#31d5c1;--gold:#f3bd58;--muted:#9db6be;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -5%,#195a70,transparent 30%),linear-gradient(145deg,#03121d,#082839);color:#f5fbfc;font:14px/1.45 Inter,system-ui;min-height:100vh}.app{max-width:1280px;margin:auto;padding:22px}.top{display:flex;align-items:center;gap:13px}.top img{width:50px}.brand{font-weight:850;font-size:20px}.brand span,.accent{color:var(--teal)}.switch{margin-left:auto;display:flex;padding:4px;background:#03131e;border:1px solid var(--line);border-radius:14px}.switch button{border:0;background:transparent;color:#8faab2;padding:9px 14px;border-radius:10px;font-weight:750;cursor:pointer}.switch button.on{background:linear-gradient(135deg,#31d5c1,#78efdf);color:#03221f}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:20px}.glass{background:linear-gradient(150deg,#123a4cbb,#071a28dc);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 60px #0004,inset 0 1px #fff1}.side{padding:18px;align-self:start}.identity{text-align:center;padding:12px}.avatar{width:78px;height:78px;border-radius:50%;margin:auto;display:grid;place-items:center;font-size:28px;font-weight:900;background:radial-gradient(circle at 30% 25%,#58ead7,#147583 58%,#082d44);box-shadow:0 0 0 7px #31d5c115}.identity h3{margin:12px 0 2px}.identity small{color:var(--muted)}nav{margin-top:14px;display:grid;gap:6px}nav button{border:0;color:#bdd0d5;background:transparent;text-align:left;padding:11px;border-radius:11px;cursor:pointer}nav button.active{color:var(--teal);background:#31d5c116}.main{display:grid;gap:18px}.hero{padding:24px;display:flex;justify-content:space-between;align-items:center;gap:18px}.hero h1{margin:5px 0;font-size:clamp(28px,4vw,46px);letter-spacing:-2px}.hero p{margin:0;color:var(--muted)}.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 25%,#4ce8d3,#147784 58%,#072b42);box-shadow:0 0 45px #31d5c148}.ring b{font-size:32px;display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.card h3{margin:4px 0 7px}.card p{color:var(--muted);min-height:42px}.label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.11em}.value{font-size:24px;font-weight:850}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:780;cursor:pointer;background:linear-gradient(135deg,var(--teal),#75edde);color:#03231f}.btn.alt{background:#ffffff0b;color:#d8e7e9;border:1px solid var(--line)}.wide{grid-column:span 2}.exchange{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tag{padding:7px 10px;border-radius:99px;border:1px solid #31d5c142;color:#a9e9e1;background:#31d5c10d}.feed{padding:18px}.feed h2{margin-top:0}.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.ico{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:#31d5c116;color:var(--teal)}.row small{display:block;color:var(--muted)}.row .state{margin-left:auto;color:var(--gold);font-size:11px}.toast{position:fixed;right:22px;bottom:22px;max-width:360px;padding:14px 17px;border:1px solid #31d5c158;background:#082839;border-radius:14px;box-shadow:0 16px 45px #0008;display:none}.toast.show{display:block}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr}.wide{grid-column:auto}.hero{align-items:flex-start}.ring{width:105px;height:105px;flex:none}}@media(max-width:520px){.app{padding:12px}.hero{padding:18px}.ring{display:none}.switch button{padding:8px}.cards{gap:10px}}
</style></head><body><main class="app"><header class="top"><img src="assets/brand-shield.webp" alt="RateMyCustomer"><div><div class="brand">RateMy<span>Customer</span></div><div class="label">RMC Report</div></div><div class="switch"><button id="customer" class="on">Customer</button><button id="servicer">Servicer</button></div></header><div class="layout"><aside class="glass side"><div class="identity"><div class="avatar" id="avatar">JC</div><h3 id="name">Jordan Customer</h3><small id="role">Preferred customer</small></div><nav><button class="active">Overview</button><button>My QR</button><button>Benefits</button><button>Verification</button><button>AI Data Exchange</button></nav></aside><section class="main"><div class="glass hero"><div><div class="label" id="eyebrow">Customer trust profile</div><h1 id="headline">Your standing unlocks more.</h1><p id="sub">Verified participation turns respectful service interactions into meaningful access.</p></div><div class="ring"><div><b id="score">782</b><small id="scoreLabel">RMC score</small></div></div></div><div class="cards" id="cards"></div><div class="glass feed"><h2>Trust activity</h2><div id="feed"></div></div></section></div></main><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s),toast=m=>{$('#toast').textContent=m;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3400)};let role='customer',summary;
const customerCards=()=>`<article class="glass card"><div class="label">Available points</div><div class="value accent">${summary.account.points||0}</div><p>Earned for verified participation—not positive sentiment.</p><button class="btn" onclick="makeQR()">Share my review QR</button></article><article class="glass card"><div class="label">Unlocked benefit</div><h3>Priority reservation</h3><p>Preferred treatment from participating servicers.</p><button class="btn" onclick="redeem()">Redeem benefit</button></article><article class="glass card"><div class="label">RMC Preferred</div><h3>Verified standing</h3><p>Pending complaints are excluded until verification.</p><button class="btn alt">View RMC Report</button></article><article class="glass card wide"><div class="label">AI Data Exchange</div><h3>Choose the metadata you share</h3><div class="exchange"><span class="tag">Service category</span><span class="tag">Resolution outcome</span><span class="tag">Interaction timing</span></div><button class="btn" onclick="consent('AMDX')">Opt in for AMDX test rewards</button></article><article class="glass card"><div class="label">Reward assets</div><div class="value">DISC · VISC · AMDX</div><p>Test-only rewards until network and custody approvals.</p></article>`;
const servicerCards=()=>`<article class="glass card"><div class="label">Business status</div><div class="value accent">Verified</div><p>Harbor House is eligible to issue reciprocal review invitations.</p><button class="btn" onclick="newInteraction()">Create interaction</button></article><article class="glass card"><div class="label">Customer review</div><h3>Signed QR invitation</h3><p>Request an honest customer review with single-use verification.</p><button class="btn" onclick="makeQR()">Generate customer QR</button></article><article class="glass card"><div class="label">Open verification</div><div class="value">${summary.complaints.filter(x=>!['resolved','rejected'].includes(x.status)).length}</div><p>No complaint changes standing before verification.</p><button class="btn alt">Review evidence</button></article><article class="glass card wide"><div class="label">Special treatment catalog</div><h3>Reward respectful customers</h3><div class="exchange"><span class="tag">Priority reservations</span><span class="tag">VIP access</span><span class="tag">15% discount</span><span class="tag">Member rewards</span></div><button class="btn">Manage benefit tiers</button></article><article class="glass card"><div class="label">Protection</div><h3>Legitimate complaint flow</h3><p>Verified interaction, evidence, response, and human review.</p><button class="btn alt" onclick="complaint()">Start complaint</button></article>`;
async function api(p,m='GET',b){const r=await fetch(p,{method:m,headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined}),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){summary=await api(`/api/accounts/${role==='customer'?'acct-c-100':'acct-s-200'}/summary`);const c=role==='customer';$('#name').textContent=summary.account.displayName;$('#avatar').textContent=c?'JC':'HH';$('#role').textContent=c?'Preferred customer':'Verified servicer';$('#eyebrow').textContent=c?'Customer trust profile':'Servicer operations';$('#headline').textContent=c?'Your standing unlocks more.':'Reward respect. Verify concerns.';$('#sub').textContent=c?'Verified participation turns respectful service interactions into meaningful access.':'Offer VIP treatment while keeping complaints factual, fair, and reviewable.';$('#score').textContent=c?summary.account.score:'✓';$('#scoreLabel').textContent=c?'RMC score':'business verified';$('#cards').innerHTML=c?customerCards():servicerCards();$('#feed').innerHTML=(summary.complaints.length?summary.complaints.slice(-3).reverse().map(x=>`<div class="row"><div class="ico">✓</div><div><b>Complaint verification</b><small>${x.category} · Rating effect: ${x.ratingEffect?'approved':'none'}</small></div><span class="state">${x.status}</span></div>`):'<div class="row"><div class="ico">✓</div><div><b>Profile ready</b><small>Verified trust safeguards active</small></div><span class="state">Protected</span></div>')}
async function newInteraction(){const i=await api('/api/interactions','POST',{customerId:'acct-c-100',servicerId:'acct-s-200',category:'restaurant'});localStorage.rmcInteraction=i.id;toast('Verified interaction created')}async function ensureInteraction(){if(!localStorage.rmcInteraction)await newInteraction();return localStorage.rmcInteraction}async function makeQR(){const id=await ensureInteraction(),q=await api('/api/qr-invitations','POST',{interactionId:id,direction:role==='customer'?'customer_to_servicer':'servicer_to_customer'});toast(`Signed QR ready · expires ${new Date(q.expiresAt).toLocaleTimeString()}`)}async function redeem(){const r=await api('/api/benefits/benefit-1/redeem','POST',{accountId:'acct-c-100'});toast(`Priority reservation unlocked · ${r.code}`);load()}async function consent(asset){const c=await api('/api/consents','POST',{accountId:'acct-c-100',metadataTags:['service_category','resolution_outcome','interaction_timing'],asset});const r=await api('/api/test-rewards','POST',{consentId:c.id,amount:7.5});toast(`${r.amount} ${r.asset} test reward recorded`);load()}async function complaint(){const id=await ensureInteraction();await api('/api/complaints','POST',{interactionId:id,category:'conduct',summary:'Servicer claim submitted for verification',evidence:['interaction_receipt']});toast('Protected complaint opened · no rating effect');load()}for(const r of ['customer','servicer'])$('#'+r).onclick=()=>{role=r;$('#customer').classList.toggle('on',r==='customer');$('#servicer').classList.toggle('on',r==='servicer');load()};load().catch(e=>toast(e.message));
</script></body></html>
